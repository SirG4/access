# ==============================================================================
# Access Portal — Development Docker Compose Configuration
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# ==============================================================================

services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: access_nextjs_dev
    environment:
      NODE_ENV: development
      ENABLE_GPU: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
